# arca — secrets broker config for thal-env.
# Secret values live in the `local` age vault; this file only declares refs.
# Materialize: `arca run --env <dev|preview|prod> -- <cmd>`.

[envs]
preview = { vault = "local" }
prod    = { vault = "local" }

[secrets]
# Per-env secrets — the ref resolves against the active env context.
GCP_GEMINI_API_KEY       = "arca://thal-env/gcp-gemini-api-key"
GCP_CLOUD_TTS_API_KEY    = "arca://thal-env/gcp-cloud-tts-api-key"
GCP_GOOGLE_CLIENT_SECRET = "arca://thal-env/gcp-google-client-secret"
STRIPE_SECRET_KEY        = "arca://thal-env/stripe-secret-key"
STRIPE_ENDPOINT_SECRET   = "arca://thal-env/stripe-endpoint-secret"

# Dev-only secrets — pinned to the dev env (absent from .env.preview/.env.prod).
TARSI_GEMINI_API_KEY = "arca://dev/thal-env/tarsi-gemini-api-key"
DELPHIS_PASSWORD     = "arca://dev/thal-env/delphis-password"
